# MediCard — Codemagic iOS
workflows:
  medicard-ios:
    name: MediCard iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: code_magic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.khusm.medicard
    scripts:
      - name: Post-clone setup
        script: |
          set -e
          flutter pub get
          cd ios && pod install && cd ..
      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        release_notes:
          en-US: |
            - Searchable branch picker in new invoice request
            - Invoice PDF download button in invoice history
            - Tap invoice notification to open PDF in browser
            - Fixed notification icon to use app logo
            - Various bug fixes and improvements
          ar-SA: |
            - إمكانية البحث في قائمة الفروع عند إنشاء طلب فاتورة
            - زر تحميل الفاتورة PDF في سجل الفواتير
            - الضغط على إشعار الفاتورة يفتح المتصفح لتحميل الـ PDF
            - إصلاح أيقونة الإشعارات لتعرض لوجو التطبيق
            - إصلاحات وتحسينات عامة
      email:
        recipients:
          - info@medicardeg.com
        notify:
          success: true
          failure: true