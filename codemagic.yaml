# MediCard — Codemagic iOS
workflows:
  medicard-ios:
    name: MediCard iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.khusm.medicard
    scripts:
      - name: Post-clone setup
        script: |
          set -e
          flutter pub get
          cd ios && pod install && cd ..
      - name: Set up code signing
        script: |
          set -e
          xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          flutter build ipa --release --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - info@medicardeg.com
        notify:
          success: true
          failure: true