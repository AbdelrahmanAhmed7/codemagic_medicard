# MediCard — Codemagic (use THIS file only; disable Workflow Editor workflow)
# https://docs.codemagic.io/troubleshooting/common-ios-issues/#scheme-xxx-not-found-from-repository-please-reconfigure-your-project
#
# In Codemagic: App settings → enable "codemagic.yaml" / disable duplicate Workflow Editor build.

workflows:
  medicard-ios:
    name: MediCard iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        CM_FLUTTER_SCHEME: Runner
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        BUNDLE_ID: com.khusm.medicard

    scripts:
      # Runs before any automatic "Installing dependencies" / scheme scan
      - name: Post-clone setup (required for Runner scheme)
        script: |
          set -e
          flutter pub get
          cd ios && pod install
          echo "=== Available schemes ==="
          xcodebuild -list -workspace ios/Runner.xcworkspace | grep -A 20 "Schemes:"

      # Code signing: configure in Codemagic UI (Teams → Code signing identities)
      # or add ios_signing / xcode-project use-profiles when certificates are ready.
      - name: Build IPA
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - info@medicardeg.com
        notify:
          success: true
          failure: true
